<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timecly</title>
  <meta name="description" content="Timecly: telefono, WhatsApp e prenotazioni in un unico posto. Non perdi più un cliente.">
  <style>
    :root { --bg: #f7f6f2; --fg: #1d1d1b; --muted: #6b6a65; --accent: #e2572b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151513; --fg: #f2f1ec; --muted: #a09f99; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; }
    h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); letter-spacing: -0.03em; margin: 0 0 .25em; }
    h1 span { color: var(--accent); }
    p { margin: 0 0 1em; color: var(--muted); }
    .tag { display: inline-block; font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
           color: var(--accent); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main>
    <div class="tag">In arrivo</div>
    <h1>Timecly<span>.</span></h1>
    <p>Telefono, WhatsApp e prenotazioni in un unico posto, con un assistente che risponde ai tuoi clienti quando tu non puoi.</p>
    <p>Non perdi più un cliente.</p>
  </main>
</body>
</html>
